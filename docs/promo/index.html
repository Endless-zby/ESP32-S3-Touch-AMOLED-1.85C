// Two worlds: the photographed hotel room, and a dark presentation stage.
const room = new THREE.Scene();

// ============================================================================

const ease = t => t<0?0:t>1?1:(t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2);
const clamp01 = v => Math.max(0,Math.min(1,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const V3 = a=>new THREE.Vector3(a[0],a[1],a[2]);

function textTexture({text, size=30, weight=600, color='#f3f6ff', bg=null, pad=20, maxW=1100, lineH=1.4, radius=20, align='center', shadow=true, scale=2}){
  const font = `${weight} ${size}px "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif`;
  const m = document.createElement('canvas').getContext('2d'); m.font = font;
  const lines=[]; for (const para of String(text).split('\n')) {
    let line=''; const tokens = para.match(/[A-Za-z0-9_.:/\-]+|\s|./g) || [];
    for (const tk of tokens) { if (m.measureText(line+tk).width > maxW && line) { lines.push(line); line = tk.trim()? tk : ''; } else line += tk; }
    lines.push(line);
  }
  const widths = lines.map(l=>m.measureText(l).width);
  const w = Math.ceil(Math.max(...widths) + pad*2), h = Math.ceil(lines.length*size*lineH + pad*2 - size*(lineH-1)*0.4);
  const c = document.createElement('canvas'); c.width = w*scale; c.height = h*scale;
  const g = c.getContext('2d'); g.scale(scale,scale);
  if (bg) { g.fillStyle = bg; rr(g,0,0,w,h,radius); g.fill(); }
  g.font = font; g.fillStyle = color; g.textBaseline='top'; g.textAlign = align;
  if (shadow) { g.shadowColor='rgba(0,0,0,.55)'; g.shadowBlur=8; g.shadowOffsetY=2; }
  lines.forEach((l,i)=>{ const x = align==='center'? w/2 : align==='left'? pad : w-pad; g.fillText(l, x, pad + i*size*lineH); });
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  return { tex, w, h };
}
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function hudText(opts){

  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:tex, transparent:true, opacity:0, depthTest:false}));
  mesh.renderOrder = 10; mesh.userData.size=[w,h]; hud.add(mesh); return mesh;
}
function sprite(opts, k=0.0032){

  const depthTest = opts.depthTest === true;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, opacity:0, depthTest}));
  s.scale.set(w*k, h*k, 1); s.renderOrder = depthTest?0:5; s.userData.size=[w,h]; return s;
}
const fades = new Set();
function fadeTo(obj, to, dur=0.5, delay=0){ fades.add({obj,from:obj.material.opacity,to,dur,delay,t:0}); }
function stepFades(dt){ for (const f of fades){ f.t+=dt; const u=clamp01((f.t-f.delay)/f.dur); if(f.t>=f.delay) f.obj.material.opacity = lerp(f.from,f.to,ease(u)); if(u>=1) fades.delete(f);} }
const pbr = (c,o={})=>new THREE.MeshPhysicalMaterial(Object.assign({color:c, roughness:.6, metalness:0}, o));

const PANO_YAW = 0.0;

const LEDGE_POS = new THREE.Vector3(-1.70, 0.65, 1.37);   // device goes here
const BED_EDGE  = new THREE.Vector3(-0.35, 0.55, -0.10);   // seat point on the right mattress edge, nearer the foot of the bed

shadowFloor.rotation.x = -Math.PI/2; shadowFloor.receiveShadow = true; room.add(shadowFloor);
const NS_POS = LEDGE_POS.clone();
const nsTop = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.02,0.45), new THREE.ShadowMaterial({opacity:0.4})); nsTop.position.copy(NS_POS).add(new THREE.Vector3(0,-0.01,0)); nsTop.receiveShadow=true; room.add(nsTop);

// ---- the device (PBR) ---------------------------------------------------
function makeDevice(){
  const g = new THREE.Group();
  const shell = pbr(0x14161c, {metalness:.85, roughness:.28, clearcoat:.6, clearcoatRoughness:.2});
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.105,0.105,0.055,96), shell);
  body.rotation.x = Math.PI/2 - 0.42; body.position.y = 0.115; body.castShadow=true; g.add(body);
  const foot = new THREE.Mesh(new THREE.BoxGeometry(0.11,0.075,0.075), shell); foot.position.set(0,0.037,0.012); foot.castShadow=true; g.add(foot);
  const bezel = new THREE.Mesh(new THREE.RingGeometry(0.088,0.1,96), pbr(0x0a0b0f,{metalness:.9,roughness:.15})); bezel.position.set(0,0.115,0); bezel.rotation.x=-0.42; bezel.translateZ(0.0281); g.add(bezel);

  const ringMat = new THREE.MeshBasicMaterial({color:0x8b5cf6, transparent:true, opacity:0, side:THREE.DoubleSide});

  const glow = new THREE.PointLight(0x8b5cf6, 0, 0.6, 2); glow.position.set(0,0.13,0.12); g.add(glow);
  g.userData = { screen, eyes, ring, glyph, glow };

}
const device = makeDevice(); device.position.copy(NS_POS); device.rotation.y = Math.atan2(BED_EDGE.x-NS_POS.x, BED_EDGE.z-NS_POS.z); room.add(device);   // screen faces the guest

const lampLight = new THREE.PointLight(0xffb86b, 1.6, 3.5, 1.8); lampLight.position.copy(NS_POS).add(new THREE.Vector3(-0.25,0.55,0.25)); lampLight.castShadow=!LOWQ; lampLight.shadow.mapSize.set(1024,1024); lampLight.shadow.bias=-0.002; room.add(lampLight);
const keyFill = new THREE.DirectionalLight(0xfff2e4, 0.6); keyFill.position.set(-2,3,2); keyFill.castShadow=!LOWQ; keyFill.shadow.mapSize.set(2048,2048); keyFill.shadow.camera.left=-4; keyFill.shadow.camera.right=4; keyFill.shadow.camera.top=4; keyFill.shadow.camera.bottom=-4; keyFill.shadow.bias=-0.001; room.add(keyFill);

// ---- the guest: rigged human (three.js Xbot, Mixamo rig) -----------------
let guest = null, mixer = null, clips = {}, currentAction = null, headBone = null, seat = null;
// Seated pose, applied after the mixer each frame. Instead of guessing bone
// axes, we steer each bone so that its *measured* axis points where a seated
// person's does, in world space: thighs along the body's forward, shins
// straight down, upper arms down, forearms forward onto the lap.
const _q = new THREE.Quaternion(), _qi = new THREE.Quaternion(), _from = new THREE.Vector3(), _to = new THREE.Vector3(), _pq = new THREE.Quaternion();
function aimBone(bone, localAxis, worldTarget, mix=1){
  if (!bone) return;
  bone.updateWorldMatrix(true,false);
  bone.getWorldQuaternion(_q);
  _from.copy(localAxis).applyQuaternion(_q).normalize();
  _to.copy(worldTarget).normalize();
  _qi.setFromUnitVectors(_from,_to);            // world-space rotation needed
  // convert to the bone's parent space and apply on the local quaternion
  bone.parent.getWorldQuaternion(_pq);
  const corr = _pq.clone().invert().multiply(_qi).multiply(_pq);
  if (mix<1) corr.slerp(new THREE.Quaternion(), 1-mix);
  bone.quaternion.premultiply(corr);
}
const DOWN = new THREE.Vector3(0,-1,0);
// A bone's own "child direction" (the axis that runs down the limb) is the
// direction to its first child in its local frame. Mixamo rigs are not all +Y,
// so measure it instead of assuming.
const _axisCache = new Map();
function limbAxis(bone){ if (!bone) return null; let a=_axisCache.get(bone); if (a) return a; const child = bone.children.find(c=>c.isBone||c.type==='Bone'||/mixamorig/.test(c.name)); if (!child) return null; a = child.position.clone().normalize(); _axisCache.set(bone,a); return a; }
function applySeated(){
  if (!seat || !seat.hips || !guest) return;
  // Pin the pelvis to the seat point, independent of the clip's root motion
  // (idle / agree move the hips a little): hips world Y = mattress top + ~pelvis half-height.
  guest.updateWorldMatrix(true,false);
  const hipsW = seat.hips.getWorldPosition(new THREE.Vector3());
  const target = new THREE.Vector3(GUEST_POS.x, GUEST_POS.y + 0.10, GUEST_POS.z);
  const delta = target.sub(hipsW);
  guest.position.add(delta);               // move the whole figure so the hips land on the seat
  const fwd = new THREE.Vector3(0,0,1).applyQuaternion(guest.quaternion).normalize();
  const thighDir = fwd.clone().multiplyScalar(0.92).addScaledVector(DOWN,0.22).normalize();
  const armDir   = DOWN.clone().addScaledVector(fwd,0.15).normalize();
  const foreDir  = fwd.clone().addScaledVector(DOWN,0.30).normalize();
  for (const [b,dir] of [[seat.lUp,thighDir],[seat.rUp,thighDir],[seat.lLeg,DOWN],[seat.rLeg,DOWN],[seat.lArm,armDir],[seat.rArm,armDir],[seat.lFore,foreDir],[seat.rFore,foreDir]]) {
    const ax = limbAxis(b); if (ax) aimBone(b, ax, dir);
  }
  // head looks at the device (so the face reads even with the body turned to camera)
  if (headBone && seat.spine) { const hp=headBone.getWorldPosition(new THREE.Vector3()); const look=device.position.clone().add(new THREE.Vector3(0,0.1,0)).sub(hp).normalize(); const hAx = limbAxis(headBone) || new THREE.Vector3(0,1,0); /* head axis points up: aim its forward (local -Z for mixamo heads) */ const fwdLocal = new THREE.Vector3(0,0,1); aimBone(headBone, fwdLocal, look, 0.7); }
  // small forward lean of the torso toward the device
  _qi.setFromAxisAngle(new THREE.Vector3(1,0,0).applyQuaternion(guest.quaternion), 0.08); seat.spine.quaternion.premultiply(seat.spine.parent.getWorldQuaternion(_pq).invert().multiply(_qi).multiply(_pq.clone().invert()));
}
const GUEST_POS = BED_EDGE.clone();
function playClip(name, fade=0.35, loop=true){
  const a = clips[name]; if (!a || !mixer) return;
  if (currentAction && currentAction !== a) currentAction.fadeOut(fade);
  a.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(fade).play();
  a.setLoop(loop?THREE.LoopRepeat:THREE.LoopOnce, Infinity); a.clampWhenFinished = !loop;
  currentAction = a;
}
function dressGuest(obj){

  obj.traverse(o=>{
    if (!o.isMesh) return;
    o.castShadow = true;

      at('ph',3.2,tl,()=>{ fadeTo(device.userData.glyph,1,0.3); phoneOn=1; linkOn(Ldev,0.2); });
      at('fs',4.6,tl,()=>linkOn(Lai,0.1));
      at('ai',6.5,tl,()=>{ clearBubbles(); const b=bubble('您好，前台客服为您服务，请问需要什么帮助？','ai',wAI.clone().add(new THREE.Vector3(0.3,0.3,0.4)),0.0014); fadeTo(b,1,0.3); });
      at('ai2',9.2,tl,()=>{ const b=bubble('空调没冷气，1208 房。','guest',wFS.clone().add(new THREE.Vector3(-0.2,0.3,0.4)),0.0014); fadeTo(b,1,0.3); });
      ringPulse = phoneOn? 0.3+0.2*Math.sin(tl*8) : (tl>1.8&&tl<3.2? 0.5+0.5*Math.sin(tl*6):0);
      nAI.rotation.y=Math.sin(tl*1.5)*0.15;
      break;
    case 'handoff':
      eyesOn=1; screenOn=1; phoneOn=1; device.userData.glyph.material.opacity=1; ringPulse=0.3+0.2*Math.sin(tl*8);
      at('l1',0.0,tl,()=>{ linkOn(Ldev,0); linkOn(Lai,0); });
      at('ai',0.6,tl,()=>{ const b=bubble('需要工程部上门检修，我帮您转人工。','ai',wAI.clone().add(new THREE.Vector3(-0.4,0.3,0.4)),0.0014); fadeTo(b,1,0.3); });
      at('tag',2.6,tl,()=>fadeTo(transferTag,1,0.3));
      at('hu',3.6,tl,()=>linkOn(Lhu,0));
      at('scr',5.4,tl,()=>{ fadeTo(transferTag,0,0.3); fadeTo(agentScreen,1,0.4); clearBubbles(); });
      at('hu2',8.0,tl,()=>{ const b=bubble('您好，我是前台小李，1208 房空调的问题已看到，工程师 10 分钟内到。','ai',wHu.clone().add(new THREE.Vector3(-0.2,0.32,0.4)),0.0014); fadeTo(b,1,0.3); });
      nHu.rotation.y=Math.sin(tl*1.2)*0.12; aiAnt.material.color.setHSL(0.5+0.1*Math.sin(tl*4),1,0.6);
      break;
    case 'benefits': {
      const adt=Math.max(dt,0.016); benefits.rotation.y=Math.sin(tl*0.35)*0.12; benDevice.rotation.y=-benefits.rotation.y+Math.sin(tl*0.8)*0.35;
      benefits.children.forEach((c,idx)=>{ if(!c.isSprite) return; const showAt=0.3+(idx%7)*0.55; if(tl>showAt&&c.material.opacity<1) c.material.opacity=Math.min(1,c.material.opacity+adt*2.5); c.position.y=1.45+Math.sin(c.userData.a*2+tl*1.3)*0.18; });
      screenOn=1; eyesOn=1; ringPulse=0.5+0.5*Math.sin(tl*2.5); break; }
    case 'arch': { const adt=Math.max(dt,0.016); let n=0; arch.children.forEach(c=>{ if(!c.isSprite) return; const showAt=0.3+(n++)*0.35; if(tl>showAt&&c.material.opacity<1) c.material.opacity=Math.min(1,c.material.opacity+adt*2.5); }); break; }
    case 'outro': stageDevice.rotation.y=tl*0.35; screenOn=1; eyesOn=1; ringPulse=0.6+0.4*Math.sin(tl*2.2); break;
  }
  for (const d of [device,stageDevice,benDevice]) {
    const {screen,eyes,ring,glow} = d.userData;
    screen.material.emissiveIntensity = lerp(0.12, 0.9, screenOn);
    eyes.children.forEach(e=>{ e.material.opacity=eyesOn; });
    ring.material.opacity=ringPulse*0.95; const sc=1+0.06*ringPulse; ring.scale.set(sc,sc,1);
    glow.intensity = ringPulse*(d===device?0.5:1.2);
  }
  lampLight.intensity = lerp(1.6, 0.45, lampDim);
  room.backgroundIntensity = lerp(1.0, 0.72, lampDim);
  if (mixer) { mixer.update(dt); applySeated(); }
}

// ============================================================================
//  Loading
// ============================================================================
const bar=document.querySelector('#bar i'), ltxt=document.getElementById('ltxt');
function prog(p,txt){ bar.style.width=(p*100)+'%'; if(txt) ltxt.textContent=txt; }
let loaded=0; const done=()=>{ loaded++; if(loaded>=2){ prog(1,'就绪'); setTimeout(()=>document.getElementById('loading').classList.add('done'),300); } };

new RGBELoader().load('./assets/hotel_room_2k.hdr', tex=>{
  tex.mapping = THREE.EquirectangularReflectionMapping;
  room.background = tex; room.environment = tex;
  room.backgroundRotation.y = PANO_YAW; room.environmentRotation.y = PANO_YAW;
  room.backgroundIntensity = 1.0; room.environmentIntensity = 0.9;
  stageScene.environment = tex; stageScene.environmentIntensity = 0.35;
  prog(0.55,'正在加载人物模型…'); done();
}, xhr=>{ if(xhr.total) prog(0.5*xhr.loaded/xhr.total,'正在加载酒店客房全景…'); }, err=>{ console.error(err); ltxt.textContent='全景加载失败'; done(); });

new GLTFLoader().load('./assets/Xbot.glb', gltf=>{
  guest = gltf.scene; dressGuest(guest);
  guest.scale.setScalar(0.95); guest.position.set(GUEST_POS.x, 0, GUEST_POS.z);   // hips are re-pinned to the seat point every frame (see applySeated)
  // Mixamo rigs face +Z. Turn the body toward the ledge/device.
  // face the device but turned ~35° toward the camera so the face is visible
  // camera sits at +x,-z of the guest; device at -x,+z. Face roughly toward the camera side
  // (3/4 front) and let the head turn toward the device each frame.
  // Face the camera (+x,-z side) three-quarters: body yaw points toward the foot of the bed.
  guest.rotation.y = Math.atan2(1.0-GUEST_POS.x, -1.4-GUEST_POS.z) - 0.55;
  room.add(guest);
  mixer = new THREE.AnimationMixer(guest);
  gltf.animations.forEach(c=>{ clips[c.name]=mixer.clipAction(c); });
  const bone = n => guest.getObjectByName('mixamorig'+n) || guest.getObjectByName('mixamorig:'+n);   // GLTFLoader strips the ':'
  headBone = bone('Head');
  seat = { hips: bone('Hips'), lUp: bone('LeftUpLeg'), rUp: bone('RightUpLeg'), lLeg: bone('LeftLeg'), rLeg: bone('RightLeg'), spine: bone('Spine'), lArm: bone('LeftArm'), rArm: bone('RightArm'), lFore: bone('LeftForeArm'), rFore: bone('RightForeArm') };
  playClip('idle',0);
  prog(1,'就绪'); done();
}, xhr=>{ if(xhr.total) prog(0.5+0.5*xhr.loaded/xhr.total,'正在加载人物模型…'); }, err=>{ console.error(err); ltxt.textContent='人物模型加载失败'; done(); });

// ============================================================================
//  Playback & recording
// ============================================================================
let playing=false, time=Math.max(0,Math.min(TOTAL-0.01,+Q.get('t')||0)), speed=1, last=performance.now(), lastReal=performance.now();
const ui=document.getElementById('ui'), top=document.getElementById('top'), hint=document.getElementById('hint');
const playBtn=document.getElementById('play'), progEl=document.querySelector('#prog i'), infoEl=document.getElementById('info');
function setPlaying(p){ playing=p; playBtn.textContent=p?'❚❚ 暂停':'▶ 播放'; }
document.getElementById('play').onclick=()=>setPlaying(!playing);
document.getElementById('prev').onclick=()=>{ const i=Math.max(0,(state.cur<0?0:state.cur)-(state.local<1?1:0)); time=SCENES[i].start; state.cur=-1; };
document.getElementById('next').onclick=()=>{ const i=Math.min(SCENES.length-1,(state.cur<0?0:state.cur)+1); time=SCENES[i].start; state.cur=-1; };
document.getElementById('speed').onchange=e=>speed=+e.target.value;
document.getElementById('prog').onclick=e=>{ const r=e.currentTarget.getBoundingClientRect(); time=TOTAL*(e.clientX-r.left)/r.width; state.cur=-1; };
window.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();setPlaying(!playing);} if(e.key==='ArrowRight') document.getElementById('next').click(); if(e.key==='ArrowLeft') document.getElementById('prev').click(); if(e.key==='r'||e.key==='R'){time=0;state.cur=-1;} });
let recorder=null, chunks=[]; const recBtn=document.getElementById('rec');
function startRec(){ const stream=renderer.domElement.captureStream(30); const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m)); recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:16_000_000}); chunks=[]; recorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); }; recorder.onstop=()=>{ const blob=new Blob(chunks,{type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='xiaoan-hotel-intro.'+(mime.includes('mp4')?'mp4':'webm'); a.click(); ui.classList.remove('hidden'); top.classList.remove('hidden'); hint.classList.remove('hidden'); recBtn.classList.remove('on'); recBtn.textContent='● 录制'; recorder=null; setPlaying(false); };
  time=0; state.cur=-1; speed=1; document.getElementById('speed').value='1'; ui.classList.add('hidden'); hint.classList.add('hidden'); top.classList.add('hidden'); recBtn.classList.add('on'); recBtn.textContent='■ 停止'; setPlaying(true); recorder.start(250); }
function stopRec(){ if(recorder&&recorder.state!=='inactive') recorder.stop(); }
recBtn.onclick=()=>recorder?stopRec():startRec();

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000)*speed; last=now; const rdt=Math.min(0.1,(now-lastReal)/1000); lastReal=now;
  if(playing){ time+=dt; if(time>=TOTAL){ time=TOTAL-0.001; if(recorder) stopRec(); else setPlaying(false); } }
  updateScene(playing?dt:0,time); stepFades(rdt); stepWaves(playing?dt:rdt); stepLinks(playing?dt:rdt);
  renderer.clear(); renderer.render(active,camera); renderer.clearDepth(); renderer.render(hud,hudCam);
  progEl.style.width=(100*time/TOTAL)+'%';
  const s=SCENES[state.cur<0?0:state.cur]; infoEl.textContent=`${(state.cur<0?0:state.cur)+1}/${SCENES.length} ${s.title} · ${time.toFixed(0)}s / ${TOTAL}s`;
}
window.__dbg={room,stageScene,device,camera,SCENES,state,get guest(){return guest},get headBone(){return headBone},BED_DIR,NS_POS,GUEST_POS};
updateScene(0,time); requestAnimationFrame(frame);
</script>
</body>
