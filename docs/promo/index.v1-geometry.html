// ============================================================================
//  Renderer / cameras
// ============================================================================
const Q = new URLSearchParams(location.search);
const LOWQ = Q.get('q') === 'low';   // ?q=low: no shadows, 1280x720 — for weak GPUs / quick preview
const REC_W = +Q.get('w') || (LOWQ?1280:1920), REC_H = +Q.get('h') || (LOWQ?720:1080);
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true, alpha:false });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = !LOWQ;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.autoClear = false;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a16);
scene.fog = new THREE.FogExp2(0x070a16, 0.028);
const camera = new THREE.PerspectiveCamera(42, 16/9, 0.1, 100);

const hud = new THREE.Scene();
const hudCam = new THREE.OrthographicCamera(-1,1,1,-1,-10,10);

function layout(){
  // 16:9 canvas that fits the window; internal resolution fixed at REC_W×REC_H
  const ww = window.innerWidth, wh = window.innerHeight;
  let w = ww, h = ww*9/16; if (h > wh) { h = wh; w = wh*16/9; }
  renderer.setSize(REC_W, REC_H, false);
  renderer.domElement.style.width = w+'px'; renderer.domElement.style.height = h+'px';
  camera.aspect = REC_W/REC_H; camera.updateProjectionMatrix();
  hudCam.left = -REC_W/2; hudCam.right = REC_W/2; hudCam.top = REC_H/2; hudCam.bottom = -REC_H/2; hudCam.updateProjectionMatrix();
}
window.addEventListener('resize', layout); layout();

// ============================================================================
//  Helpers
// ============================================================================
const ease = t => t<0?0:t>1?1:(t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2);
const clamp01 = v => Math.max(0,Math.min(1,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const V3 = (a)=>new THREE.Vector3(a[0],a[1],a[2]);

function textTexture({text, size=30, weight=600, color='#f3f6ff', bg=null, pad=20, maxW=1100, lineH=1.4, radius=20, align='center', shadow=true, scale=2}){
  const font = `${weight} ${size}px "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif`;
  const m = document.createElement('canvas').getContext('2d'); m.font = font;
  // wrap per character (CJK) / per word (latin)
  const lines=[]; for (const para of String(text).split('\n')) {
    let line=''; const tokens = para.match(/[A-Za-z0-9_.:/\-]+|\s|./g) || [];
    for (const tk of tokens) { if (m.measureText(line+tk).width > maxW && line) { lines.push(line); line = tk.trim()? tk : ''; } else line += tk; }
    lines.push(line);
  }
  const widths = lines.map(l=>m.measureText(l).width);
  const w = Math.ceil(Math.max(...widths) + pad*2), h = Math.ceil(lines.length*size*lineH + pad*2 - size*(lineH-1)*0.4);
  const c = document.createElement('canvas'); c.width = w*scale; c.height = h*scale;
  const g = c.getContext('2d'); g.scale(scale,scale);
  if (bg) { g.fillStyle = bg; rr(g,0,0,w,h,radius); g.fill(); }
  g.font = font; g.fillStyle = color; g.textBaseline='top'; g.textAlign = align;
  if (shadow) { g.shadowColor='rgba(0,0,0,.55)'; g.shadowBlur=8; g.shadowOffsetY=2; }
  lines.forEach((l,i)=>{ const x = align==='center'? w/2 : align==='left'? pad : w-pad; g.fillText(l, x, pad + i*size*lineH); });
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  return { tex, w, h };
}
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

// HUD text plane in pixels
function hudText(opts){
  const {tex,w,h} = textTexture(opts);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:tex, transparent:true, opacity:0, depthTest:false}));
  mesh.renderOrder = 10; mesh.userData.size=[w,h]; hud.add(mesh); return mesh;
}
// world-space sprite label
function sprite(opts, k=0.0032){
  const {tex,w,h} = textTexture(opts);
  const depthTest = opts.depthTest === true;   // default: draw on top (labels); cards pass depthTest:true to be occluded normally
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, opacity:0, depthTest}));
  s.scale.set(w*k, h*k, 1); s.renderOrder = depthTest?0:5; s.userData.size=[w,h]; return s;
}
const fades = new Set();
function fadeTo(obj, to, dur=0.5, delay=0){ fades.add({obj,from:obj.material.opacity,to,dur,delay,t:0}); }
function stepFades(dt){ for (const f of fades){ f.t+=dt; const u=clamp01((f.t-f.delay)/f.dur); if(f.t>=f.delay) f.obj.material.opacity = lerp(f.from,f.to,ease(u)); if(u>=1) fades.delete(f);} }

// --- sound waves guest -> device ------------------------------------------------
const waves = []; const waveMat = new THREE.MeshBasicMaterial({color:0x22d3ee, transparent:true, opacity:0.0, side:THREE.DoubleSide});
for (let i=0;i<4;i++){ const w = new THREE.Mesh(new THREE.RingGeometry(0.08,0.1,48), waveMat.clone()); w.visible=false; room.add(w); waves.push(w); }
let waveClock = -1; const waveFrom = new THREE.Vector3(0.5,1.75,-0.6), waveDir = new THREE.Vector3();
function waveBurst(){ waveClock = 0; }
function stepWaves(dt){
  if (waveClock<0) return; waveClock += dt;
  waveDir.copy(DEV_POS).add(new THREE.Vector3(0,0.45,0)).sub(waveFrom);
  const len = waveDir.length(); waveDir.normalize();
  waves.forEach((w,i)=>{ const u = (waveClock - i*0.22)/1.1; if (u<0||u>1){ w.visible=false; return; }
    w.visible=true; w.position.copy(waveFrom).addScaledVector(waveDir, u*len); w.lookAt(waveFrom); const s = 1+u*5; w.scale.set(s,s,1); w.material.opacity = 0.9*(1-u); });
  if (waveClock > 2.0) { waveClock = -1; waves.forEach(w=>w.visible=false); }
}

// --- speech bubbles ---------------------------------------------------------------
const bubbles = [];
function bubble(text, who, pos, k=0.0030){
  const isGuest = who==='guest';
  const s = sprite({text, size:30, weight:600, color: isGuest?'#0b1020':'#f8f5ff', bg: isGuest?'rgba(255,255,255,.95)':'rgba(109,74,232,.95)', pad:18, radius:22, maxW:620}, k);

  scene.add(tube); scene.add(dot);
  const L = { tube, dot, glow, curve, u:0, active:false, speed:0.35 }; links.push(L); return L;
}

      at('tag',2.6,tl,()=>{ fadeTo(transferTag,1,0.3); });
      at('hu',3.6,tl,()=>{ linkOn(Lhu,0); });
      at('scr',5.4,tl,()=>{ fadeTo(transferTag,0,0.3); fadeTo(agentScreen,1,0.4); clearBubbles(); });
      at('hu2',8.0,tl,()=>{ const b=bubble('您好，我是前台小李，1208 房空调的问题已看到，工程师 10 分钟内到。','ai',wHu.clone().add(new THREE.Vector3(-0.4,0.65,1.0)), 0.0032); fadeTo(b,1,0.3); });
      nHu.rotation.y = Math.sin(tl*1.2)*0.12; aiAnt.material.color.setHSL(0.5+0.1*Math.sin(tl*4),1,0.6);
      break; }
    case 'benefits': {
      const adt = Math.max(dt, 0.016);
      benefits.rotation.y = Math.sin(tl*0.35)*0.12; benDevice.rotation.y = -benefits.rotation.y + Math.sin(tl*0.8)*0.35;   // gentle sway; the camera does the orbiting
      benefits.children.forEach((c,idx)=>{ if(!c.isSprite) return; const showAt = 0.3 + (idx%7)*0.55; if (tl>showAt && c.material.opacity<1) c.material.opacity = Math.min(1, c.material.opacity + adt*2.5); c.position.y = 1.25 + Math.sin(c.userData.a*2 + tl*1.3)*0.18; });
      screenOn=1; eyesOn=1; ringPulse=0.5+0.5*Math.sin(tl*2.5);
      break; }
    case 'arch': {
      const adt = Math.max(dt, 0.016); let n=0; arch.children.forEach(c=>{ if(!c.isSprite) return; const showAt = 0.3 + (n++)*0.35; if (tl>showAt && c.material.opacity<1) c.material.opacity = Math.min(1, c.material.opacity + adt*2.5); });
      arch.children.forEach(c=>{ if(c.isSprite && c!==aLLM&&c!==aCC) c.position.y += Math.sin(tl*1.2 + c.position.x)*0.0006; });
      break; }
    case 'outro': {
      introDevice.rotation.y = tl*0.35; particles.rotation.y = tl*0.04; screenOn=1; eyesOn=1; ringPulse=0.6+0.4*Math.sin(tl*2.2);
      break; }
  }
  // apply device visual state to both device clones
  for (const d of [device, introDevice, benDevice]) {
    const sm = d.children.find(c=>c.geometry && c.geometry.type==='CircleGeometry');
    if (!sm) continue;
    sm.material.emissiveIntensity = lerp(0.15, 0.9, screenOn);
    const ey = sm.children.find(c=>c.isGroup); const rg = sm.children.find(c=>c.geometry&&c.geometry.type==='RingGeometry');
    if (ey) ey.children.forEach(e=>{ e.material.opacity = eyesOn; });
    if (rg) { rg.material.opacity = ringPulse*0.95; const sc = 1+0.06*ringPulse; rg.scale.set(sc,sc,1); }
  }
  screenGlow.intensity = ringPulse*1.2;
  lampLight.intensity = lerp(2.6, 0.7, lampDim); shadeMat.emissiveIntensity = lerp(0.9, 0.25, lampDim);
  // keep bubbles facing camera (sprites do) — nothing to do
}

// ============================================================================
//  Playback & recording
// ============================================================================
let playing = false, time = Math.max(0, Math.min(TOTAL-0.01, +Q.get('t') || 0)), speed = 1, last = performance.now();   // ?t=SECONDS seeks for screenshots
const ui = document.getElementById('ui'), top = document.getElementById('top'), hint = document.getElementById('hint');
const playBtn = document.getElementById('play'), progEl = document.querySelector('#prog i'), infoEl = document.getElementById('info');
function setPlaying(p){ playing=p; playBtn.textContent = p?'❚❚ 暂停':'▶ 播放'; }
document.getElementById('play').onclick = ()=>setPlaying(!playing);
document.getElementById('prev').onclick = ()=>{ const i = Math.max(0,(state.cur<0?0:state.cur) - (state.local<1?1:0)); time = SCENES[i].start; state.cur=-1; };
document.getElementById('next').onclick = ()=>{ const i = Math.min(SCENES.length-1,(state.cur<0?0:state.cur)+1); time = SCENES[i].start; state.cur=-1; };
document.getElementById('speed').onchange = e=>speed=+e.target.value;
document.getElementById('prog').onclick = e=>{ const r=e.currentTarget.getBoundingClientRect(); time = TOTAL*(e.clientX-r.left)/r.width; state.cur=-1; };
window.addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); setPlaying(!playing);} if(e.key==='ArrowRight') document.getElementById('next').click(); if(e.key==='ArrowLeft') document.getElementById('prev').click(); if(e.key==='r'||e.key==='R'){ time=0; state.cur=-1; } });

let lastReal = performance.now();
let recorder=null, chunks=[];
const recBtn = document.getElementById('rec');
function startRec(){
  const stream = renderer.domElement.captureStream(30);
  const mime = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m));
  recorder = new MediaRecorder(stream, { mimeType:mime, videoBitsPerSecond: 16_000_000 }); chunks=[];
  recorder.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
  recorder.onstop = ()=>{ const blob = new Blob(chunks,{type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='xiaoan-hotel-intro.'+(mime.includes('mp4')?'mp4':'webm'); a.click(); ui.classList.remove('hidden'); top.classList.remove('hidden'); hint.classList.remove('hidden'); recBtn.classList.remove('on'); recBtn.textContent='● 录制'; recorder=null; setPlaying(false); };
  time=0; state.cur=-1; speed=1; document.getElementById('speed').value='1'; ui.classList.add('hidden'); hint.classList.add('hidden'); top.classList.add('hidden'); recBtn.classList.add('on'); recBtn.textContent='■ 停止';
  setPlaying(true); recorder.start(250);
}
function stopRec(){ if(recorder && recorder.state!=='inactive') recorder.stop(); }
recBtn.onclick = ()=> recorder ? stopRec() : startRec();

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05,(now-last)/1000)*speed; last = now;
  if (playing) { time += dt; if (time>=TOTAL){ time = TOTAL-0.001; if (recorder) { stopRec(); } else setPlaying(false); } }
  const rdt = Math.min(0.1,(now-lastReal)/1000); lastReal = now;
  updateScene(playing?dt:0, time); stepFades(rdt); stepWaves(playing?dt:rdt); stepLinks(playing?dt:rdt);
  renderer.clear(); renderer.render(scene,camera); renderer.clearDepth(); renderer.render(hud,hudCam);
  progEl.style.width = (100*time/TOTAL)+'%';
  const s = SCENES[state.cur<0?0:state.cur]; infoEl.textContent = `${(state.cur<0?0:state.cur)+1}/${SCENES.length} ${s.title} · ${time.toFixed(0)}s / ${TOTAL}s`;
}
window.__dbg = { scene, benefits, benDevice, device, introDevice, camera, SCENES, state };   // console inspection
updateScene(0,time); requestAnimationFrame(frame);
</script>
